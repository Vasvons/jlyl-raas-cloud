name: Restart Publish Worker

# 手动触发：重启云端发布 Worker 容器（用于释放卡死任务/僵尸浏览器）
on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            echo "===== 重启前状态 ====="
            docker inspect jlyl-cloud-publish-worker --format 'RestartCount={{.RestartCount}} Status={{.State.Status}} StartedAt={{.State.StartedAt}}'
            echo "===== 执行重启 ====="
            docker restart jlyl-cloud-publish-worker
            sleep 8
            echo "===== 重启后状态 ====="
            docker ps --filter name=jlyl-cloud-publish-worker --format "{{.Names}} {{.Status}}"
            docker logs jlyl-cloud-publish-worker --tail 15 --timestamps 2>&1
